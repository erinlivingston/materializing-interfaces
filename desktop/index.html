<!doctype html>
<html lang="en" data-view="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Desktop (Desktop)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Marck+Script&family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.css"
    />
    <link rel="stylesheet" href="../shared/css/common.css" />
  </head>
  <body>
    <main class="viewport viewport--desktop viewport--bg-landscape" id="desktop-viewport">
      <div id="material-base" class="material-base">
        <div class="material-placeholder"></div>
      </div>

      <div id="window-layer" class="window-layer" aria-label="Desktop windows"></div>

      <button id="desktop-code-icon" class="desktop-app-icon" type="button" aria-label="Open code editor window">
        <span class="desktop-app-icon__glyph" aria-hidden="true">⌘</span>
        <span class="desktop-app-icon__label">Editor</span>
      </button>

      <footer class="start-bar" aria-label="Start bar">
        <button id="desktop-start-btn" class="start-bar__start" type="button">Start</button>
        <div class="start-bar__spacer" aria-hidden="true"></div>
        <time class="start-bar__clock" datetime="" aria-live="polite">—:—</time>
      </footer>

      <div
        id="desktop-entry-overlay"
        class="desktop-entry-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="desktop-entry-title"
      >
        <div class="desktop-entry-overlay__glass">
          <p id="desktop-entry-title" class="visually-hidden">Desktop entry</p>
          <div class="desktop-entry-overlay__avatar" aria-hidden="true">
            <img class="profile-avatar-img desktop-entry-overlay__avatar-img" src="../assets/iconphotos/png/sara-cervera-BULkOCPQnmU-unsplash.png" alt="" />
          </div>
          <input
            type="password"
            id="desktop-entry-submit"
            class="desktop-entry-overlay__pill"
            placeholder="enter password"
            autocomplete="off"
            spellcheck="false"
            aria-label="Password — type anything or click to enter"
          />
        </div>
      </div>

      <div
        id="window-layer-folders"
        class="window-layer window-layer--folders"
        aria-hidden="true"
      ></div>

      <div class="hud" aria-hidden="true">
        <div class="hud__title">Material Desktop</div>
        <div class="hud__sub">Desktop windows placeholder</div>
      </div>
    </main>

    <script type="module" src="../shared/js/overlay.js"></script>
  </body>
</html>
