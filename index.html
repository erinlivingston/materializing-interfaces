<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Marck+Script&family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var isMobile =
          window.matchMedia("(pointer: coarse)").matches ||
          window.innerWidth <= 768;
        window.location.replace(isMobile ? "./mobile/" : "./desktop/");
      })();
    </script>
    <link rel="stylesheet" href="./shared/css/common.css" />
    <style>
      .landing-index {
        position: relative;
        z-index: 1;
        max-width: 520px;
        padding: 28px 28px 32px;
        margin: 0;
        color: rgba(18, 32, 52, 0.92);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .landing-index h1 {
        margin: 0 0 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .landing-index p {
        margin: 0 0 14px;
        line-height: 1.45;
      }
      .landing-index ul {
        margin: 0;
        padding-left: 1.2em;
      }
      .landing-index a {
        color: rgba(0, 90, 160, 0.95);
        font-weight: 600;
      }
      .landing-index a:hover {
        color: rgba(0, 60, 130, 0.98);
      }
    </style>
  </head>
  <body>
    <main class="viewport">
      <div
        class="material-base"
        style="background-image: url('./assets/desktopbackgrounddigital.jpg')"
        aria-hidden="true"
      ></div>
      <div class="landing-index" id="landing-index">
        <h1>Material Desktop</h1>
        <p id="landing-status">Detecting your device…</p>
        <ul>
          <li><a href="./desktop/">Desktop</a></li>
          <li><a href="./mobile/">Mobile</a></li>
        </ul>
      </div>
    </main>

  </body>
</html>
