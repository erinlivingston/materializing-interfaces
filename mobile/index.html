<!doctype html>
<html lang="en" data-view="mobile">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Material Desktop (Mobile)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Marck+Script&family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/css/common.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.0/lib/p5.min.js"></script>
    <script src="../shared/js/p5.riso.js"></script>
  </head>
  <body>
    <main class="viewport viewport--mobile">
      <div class="mobile-preview-chrome">
        <p class="mobile-preview-chrome__label">
          materializing the feed, desktop mobile preview
        </p>
        <a class="mobile-preview-chrome__back" href="../desktop/">Back to desktop view</a>
      </div>
      <div id="mobile-app" class="mobile-app">
        <section id="screen-home" class="mobile-screen mobile-screen--home active"></section>
        <section id="screen-feed" class="mobile-screen mobile-screen--feed"></section>
        <section id="screen-stories" class="mobile-screen mobile-screen--stories"></section>
        <section id="screen-project" class="mobile-screen mobile-screen--project"></section>
      </div>
    </main>

    <script type="module" src="../shared/js/mobileApp.js"></script>
  </body>
</html>
